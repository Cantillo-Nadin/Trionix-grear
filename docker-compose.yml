services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"   # solo local (Compass); no expuesto a internet
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [trionix-net]

  api:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"     # solo para probar en local
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [trionix-net]

  tunnel:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks: [trionix-net]

volumes:
  mongo-data:

networks:
  trionix-net: